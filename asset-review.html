<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VirtuaCo asset review</title><style>body{font:15px system-ui;margin:24px;background:#f4f5f6;color:#16232e}header{position:sticky;top:0;background:#f4f5f6;padding:12px 0}input,select,button{font:inherit;padding:8px;margin:4px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}article{background:white;border:1px solid #ddd;border-radius:8px;padding:12px;overflow-wrap:anywhere}img{width:100%;height:210px;object-fit:contain;background:#eee}small{display:block;color:#52606b}a{color:#18558a}</style><h1>Asset review — not live merchandise</h1><p>Review source photographs and record physical orientation, identity and quality. Decisions remain local and do not publish or activate assets.</p><header><input id="search" placeholder="Name or barcode"><select id="library"><option value="original">Originals</option><option value="alternate">Alternate candidates</option><option value="external">External candidates</option></select><select id="filter"><option value="">All roles</option><option>front</option><option>nutrition</option><option>ingredients</option><option>unclassified</option></select><button id="export">Export local decisions</button><button id="prev">Previous</button><button id="next">Next</button><span id="status" role="status"></span></header><div id="grid"></div><script type="module">
const $=id=>document.getElementById(id), paths={original:'retail-source',alternate:'retail-candidates',external:'external-review'};
let decisions={};try{decisions=JSON.parse(localStorage.getItem('virtuaco-asset-review-v1')||'{}')}catch{}
let page=0, rows=[], names={}, generation=0;
const cat=await fetch('./data/open-food-facts.json').then(r=>r.json()).catch(()=>({products:[]}));for(const p of cat.products||[])names[p.upc]=p.name;
function node(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n}
async function load(){const g=++generation;page=0;rows=[];const folder=paths[$('library').value];$('status').textContent='Loading';try{const r=await fetch('./assets/'+folder+'/index.json');if(!r.ok)throw Error('Library not yet published');const data=await r.json();if(g!==generation)return;rows=Object.entries(data.entries).filter(([k,e])=>e.status==='acquired'&&/^[a-f0-9]{24}\.webp$/.test(e.file)).map(([k,e])=>({...e,key:folder+':'+k,folder,upc:e.upc||k.split(':')[0],name:e.name||e.title||names[e.upc||k.split(':')[0]]||k}));render()}catch(e){if(g===generation){$('grid').replaceChildren();$('status').textContent=e.message}}}
function render(){const q=$('search').value.toLowerCase(),role=$('filter').value;const visible=rows.filter(e=>(e.name+' '+e.upc).toLowerCase().includes(q)&&(!role||e.role===role));page=Math.min(page,Math.max(0,Math.ceil(visible.length/24)-1));$('status').textContent=visible.length+' images · page '+(page+1)+' / '+Math.max(1,Math.ceil(visible.length/24));$('prev').disabled=page===0;$('next').disabled=(page+1)*24>=visible.length;const cards=[];for(const e of visible.slice(page*24,page*24+24)){const card=node('article'),img=node('img');img.loading='lazy';img.alt=e.name;img.src='./assets/'+e.folder+'/'+e.file;card.append(img,node('strong',e.name),node('small',e.upc+' · '+(e.role||'unclassified')),node('small',(e.originalDimensions||e.dimensions||[]).join(' × ')+' · '+(e.license||e.imageLicense||e.metadata?.LicenseShortName||'License review required')));const a=node('a','Source and attribution');try{const u=new URL(e.source);if(u.protocol==='https:'){a.href=u.href;a.target='_blank';a.rel='noopener';card.append(a)}}catch{}const select=node('select');select.setAttribute('aria-label','Review decision for '+e.name);for(const v of ['unreviewed','front','rear','left','right','top','bottom','detail only','wrong product','poor image','rights unresolved']){const o=node('option',v);o.value=v;select.append(o)}select.value=decisions[e.key]?.decision||'unreviewed';select.onchange=()=>{decisions[e.key]={decision:select.value,source:e.source,file:e.file,reviewedAt:new Date().toISOString()};try{localStorage.setItem('virtuaco-asset-review-v1',JSON.stringify(decisions))}catch{alert('Local storage unavailable; export decisions before closing.')}};card.append(select);cards.push(card)}$('grid').replaceChildren(...cards)}
$('library').onchange=load;for(const id of ['search','filter'])$(id).oninput=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:1,decisions},null,2)],{type:'application/json'}));const a=node('a');a.href=u;a.download='virtuaco-asset-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};load();
</script></html>

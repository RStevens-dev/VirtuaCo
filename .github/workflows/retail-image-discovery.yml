name: Discover alternate product images
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/retail-image-discovery.yml
permissions:
  contents: write
concurrency:
  group: retail-image-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/discover-retail-images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retail-image-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish product image candidate inventory"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

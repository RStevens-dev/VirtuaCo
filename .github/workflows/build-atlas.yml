name: Build merchandise image atlas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-atlas.yml'
      - 'tools/build_atlas.py'
permissions:
  contents: write
concurrency:
  group: virtuaco-atlas
  cancel-in-progress: false
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install Pillow
      - run: python3 tools/build_atlas.py
      - name: Publish atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/merch-atlas.webp assets/merch-atlas.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish product scan image atlas"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

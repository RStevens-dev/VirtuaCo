name: Build licensed retail artwork
on:
  workflow_dispatch:
  push:
    paths:
      - tools/build-retail-art.py
      - .github/workflows/retail-art.yml
      - data/open-food-facts.json
permissions:
  contents: write
concurrency:
  group: retail-art
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/build-retail-art.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/retail-art
          git diff --cached --quiet && exit 0
          git commit -m "Publish licensed local product artwork"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

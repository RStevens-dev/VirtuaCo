name: Discover nonfood products
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nonfood-discovery.yml
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python tools/discover-nonfood.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nonfood-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish nonfood candidate inventory"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
